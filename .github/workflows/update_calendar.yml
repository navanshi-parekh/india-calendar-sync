name: Update India Macro Calendar

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright icalendar pytz
          playwright install --with-deps chromium

      - name: Run calendar scraper
        run: |
          python sync_calendar.py

      - name: Commit and push updated .ics file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add india_macro_calendar.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated monthly calendar update" && git push)